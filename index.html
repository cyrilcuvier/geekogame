<style>
  :root {
    --bg: #070b16;
    --shell: #161f38;
    --shell-hi: #24305a;
    --ink: #e8eefc;
    --muted: #8d9bbd;
    --amber: #ffb547;
    --cyan: #6ec8ff;
    --line: #3a4770;
    --focus: #ffe25c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  #app {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom)); padding-inline: 16px;
    gap: 10px;
  }
  #shell {
    background: linear-gradient(180deg, var(--shell-hi), var(--shell));
    border-radius: 18px 18px 18px 48px; padding: 12px 12px 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    width: min(100%, 984px, calc((100dvh - var(--padh)) * 4 / 3 + 24px));
  }
  :root { --padh: 130px; }
  @media (pointer: coarse) and (orientation: portrait) { :root { --padh: 300px; } }
  #screen { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  #bar b { color: var(--amber); font-weight: 700; }
  #mute:focus-visible, .btn:focus-visible, #li:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #li { color: var(--amber); font-weight: 700; text-decoration: none; letter-spacing: .06em; }
  #mute { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 11px; cursor: pointer; }
  #pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; padding: 4px 10px 0; }
  .coarse #pad { display: flex; }
  .coarse #keys { display: none; }
  .dpad { display: flex; gap: 14px; }
  .btn {
    width: 78px; height: 78px; border-radius: 50%; border: none; font: inherit; font-size: 26px; font-weight: 700;
    color: var(--ink); background: radial-gradient(circle at 35% 30%, #3b4a7c, #1c2645);
    box-shadow: 0 6px 0 #0c1226, 0 10px 18px rgba(0,0,0,.45); touch-action: none;
  }
  .btn.dir { border-radius: 18px; width: 74px; }
  .btn.a { width: 92px; height: 92px; background: radial-gradient(circle at 35% 30%, #ffcf7a, #e08a1c); color: #2a1600; }
  .btn.on { transform: translateY(4px); box-shadow: 0 2px 0 #0c1226, 0 4px 10px rgba(0,0,0,.4); }
  @media (pointer: coarse) and (orientation: landscape) {
    #app { flex-direction: row; gap: 14px; }
    #pad { position: fixed; inset: auto 0 12px 0; width: 100%; pointer-events: none; padding: 0 18px; }
    #pad > * { pointer-events: auto; }
    .btn { opacity: .82; }
  }
</style>

function reset() {
  buildLevel();
  S.mode = 'play'; S.time = 0; S.score = 0; S.zone = -1; S.banner = 0; S.win = 0;
  document.getElementById('li').hidden = true;
  pl.cpx = checkpoints[0].x; respawn(true);
  S.cam = 0;
}
function respawn(first) {
  pl.x = pl.cpx - 7; pl.y = 15 * TS - pl.h; pl.vx = 0; pl.vy = 0; pl.inv = first ? 0 : 1.2; pl.onGround = false; pl.ride = null;
  if (!first) { sfx('respawn'); burst(pl.x + 7, pl.y + 20, '#ffffff', 14); }
}
function addScore(n, x, y, col = '#ffe25c') { S.score = Math.max(0, S.score + n); pops.push({ x, y, t: 0, s: (n > 0 ? '+' : '') + n, col }); }
function burst(x, y, col, n = 10, sp = 120) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.4 + Math.random() * 0.8); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: 0.5 + Math.random() * 0.4, col }); } }

function podActive(i) { const p = (S.time + podPhase[i]) % 3.0; return p < 2.0; }
function podBlink(i) { const p = (S.time + podPhase[i]) % 3.0; return p > 1.45 && p < 2.0; }
function solidAt(tx, ty) { const t = at(tx, ty); return t === SOLID; }
function topSurfaceAt(tx, ty) { const t = at(tx, ty); if (t === SOLID || t === ONEWAY) return true; if (t === POD) return podActive(ty * COLS + tx); return false; }

function updateMovers(dt) {
  for (const m of movers) {
    m.px = m.x; m.py = m.y;
    const u = 0.5 - 0.5 * Math.cos(((S.time / m.period + m.phase / m.period) % 1) * Math.PI * 2);
    m.x = m.x0 + m.dx * u; m.y = m.y0 + m.dy * u;
  }
}

function stepPlayer(dt) {
  const ACC = pl.onGround ? 1100 : 850, DEC = 1500, MAX = 136, GRAV = 1500, JUMPV = -505;
  let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (BOT) dir = botDir;
  if (dir) { pl.vx += dir * ACC * dt; pl.face = dir; } else { const s = Math.sign(pl.vx); pl.vx -= s * DEC * dt; if (Math.sign(pl.vx) !== s) pl.vx = 0; }
  pl.vx = Math.max(-MAX, Math.min(MAX, pl.vx));
  if (jumpEdge || (BOT && botJump)) { pl.buf = 0.13; }
  jumpEdge = false; botJump = false;
  pl.buf -= dt; pl.coyote -= dt;
  if (pl.onGround) pl.coyote = 0.09;
  if (pl.buf > 0 && pl.coyote > 0) { pl.vy = JUMPV; pl.buf = 0; pl.coyote = 0; pl.onGround = false; pl.ride = null; sfx('jump'); }
  const holding = BOT ? botHold : keys.jump;
  if (!holding && pl.vy < -190) pl.vy = -190;
  pl.vy = Math.min(560, pl.vy + GRAV * dt);
  // ride moving platform
  if (pl.ride) { pl.x += pl.ride.x - pl.ride.px; pl.y += pl.ride.y - pl.ride.py; }
  // X
  pl.x += pl.vx * dt;
  {
    const y0 = Math.floor(pl.y / TS), y1 = Math.floor((pl.y + pl.h - 1) / TS);
    if (pl.vx > 0 || true) {
      const tx = Math.floor((pl.x + pl.w) / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { pl.x = tx * TS - pl.w - 0.01; pl.vx = Math.min(0, pl.vx); break; }
      const tx2 = Math.floor(pl.x / TS);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx2, ty)) { pl.x = (tx2 + 1) * TS + 0.01; pl.vx = Math.max(0, pl.vx); break; }
    }
  }
  if (pl.x < 0) { pl.x = 0; pl.vx = 0; }
  // Y
  const prevBottom = pl.y + pl.h;
  pl.y += pl.vy * dt;
  const wasGround = pl.onGround;
  pl.onGround = false; pl.ride = null;
  const x0 = Math.floor((pl.x + 1) / TS), x1 = Math.floor((pl.x + pl.w - 1) / TS);
  if (pl.vy >= 0) {
    const ty = Math.floor((pl.y + pl.h) / TS);
    for (let tx = x0; tx <= x1; tx++) {
      const t = at(tx, ty);
      const top = ty * TS;
      const ok = t === SOLID || ((t === ONEWAY || (t === POD && podActive(ty * COLS + tx))) && prevBottom <= top + 2);
      if (ok) { pl.y = top - pl.h; pl.vy = 0; pl.onGround = true; break; }
    }
    if (!pl.onGround) for (const m of movers) {
      if (pl.x + pl.w > m.x + 1 && pl.x < m.x + m.w - 1 && prevBottom <= m.py + 3 && pl.y + pl.h >= m.y) {
        pl.y = m.y - pl.h; pl.vy = 0; pl.onGround = true; pl.ride = m; break;
      }
    }
  } else {
    const ty = Math.floor(pl.y / TS);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { pl.y = (ty + 1) * TS; pl.vy = 0; break; }
  }
  if (pl.onGround && !wasGround && prevBottom < pl.y + pl.h + 1) { pl.land = 0.09; sfx('land'); }
  pl.land -= dt; pl.inv -= dt;
  if (pl.onGround && Math.abs(pl.vx) > 5) pl.dist += Math.abs(pl.vx) * dt;
  // hazards
  const fx0 = Math.floor((pl.x + 3) / TS), fx1 = Math.floor((pl.x + pl.w - 3) / TS), fy = Math.floor((pl.y + pl.h - 4) / TS);
  for (let tx = fx0; tx <= fx1; tx++) if (at(tx, fy) === SPIKE && (pl.y + pl.h) > fy * TS + 8) { hurtRespawn(); return; }
  if (pl.y > H + 60) hurtRespawn();
}
function hurtRespawn() { sfx('hurt'); S.shake = 0.25; addScore(-100, pl.x, pl.y, '#ff6a7a'); respawn(false); }
function hurtKnock(fromX) { if (pl.inv > 0) return; sfx('hurt'); S.shake = 0.18; pl.inv = 1.1; pl.vx = (pl.x + 7 < fromX ? -1 : 1) * 170; pl.vy = -260; pl.onGround = false; addScore(-50, pl.x, pl.y, '#ff6a7a'); }

function stepEnemies(dt) {
  for (const e of enemies) {
    if (!e.alive) { e.dead += dt; continue; }
    e.t += dt;
    if (Math.abs(e.x - (pl.x + 7)) > W) continue;
    if (e.type === 'ghost') { e.x = e.x0 + Math.sin(e.t * 0.9) * e.range; e.y = e.y0 - 6 + Math.sin(e.t * 2.4) * 10; e.w = 14; e.h = 14; }
    else if (e.type === 'fee') { e.x = e.x0 + Math.sin(e.t * 1.1) * e.range; e.y = e.y0 + Math.sin(e.t * 2.2) * 18; e.w = 12; e.h = 12; }
    else {
      e.w = e.type === 'noisy' ? 14 : 12; e.h = e.type === 'noisy' ? 14 : 10;
      if (e.type === 'crash') { e.jt = (e.jt || 0) - dt; if (e.jt <= 0 && e.onG) { e.vy = -260; e.jt = 1.3 + Math.random() * 0.6; e.onG = false; } }
      if (e.type === 'noisy') { e.jt = (e.jt || 0) - dt; if (e.jt <= 0 && e.onG) { e.vy = -150; e.jt = 0.5; e.onG = false; } }
      e.vy = Math.min(500, (e.vy || 0) + 1300 * dt);
      const sp = e.type === 'segfault' ? 42 : 30;
      if (!e.vx) e.vx = -sp;
      e.vx = Math.sign(e.vx) * sp;
      const nx = e.x + e.vx * dt;
      const front = Math.floor((nx + Math.sign(e.vx) * (e.w / 2 + 1)) / TS);
      const feetT = Math.floor((e.y - 1) / TS);
      const wall = solidAt(front, feetT) || solidAt(front, Math.floor((e.y - e.h) / TS));
      const edge = e.onG && !topSurfaceAt(front, Math.floor((e.y + 2) / TS));
      if (wall || edge || at(front, Math.floor((e.y + 2) / TS)) === SPIKE) e.vx = -e.vx; else e.x = nx;
      e.y += e.vy * dt;
      const ty = Math.floor(e.y / TS), tx = Math.floor(e.x / TS);
      e.onG = false;
      if (e.vy >= 0 && topSurfaceAt(tx, ty)) { e.y = ty * TS; e.vy = 0; e.onG = true; }
      if (e.y > H + 40) e.alive = false;
    }
    // collision with player (enemy box: centered x, bottom y)
    const ex0 = e.x - e.w / 2, ey0 = e.y - e.h;
    if (pl.x + pl.w > ex0 && pl.x < ex0 + e.w && pl.y + pl.h > ey0 && pl.y < e.y) {
      if (pl.vy > 40 && pl.y + pl.h - ey0 < 12) {
        e.alive = false; e.dead = 0; pl.vy = -330; sfx('stomp'); burst(e.x, ey0 + 4, '#ffffff', 12);
        addScore(200, e.x, ey0);
      } else if (e.type === 'fee') {
        if (pl.inv <= 0) { sfx('fee'); pl.inv = 1.0; addScore(-100, e.x, ey0, '#ff6aa0'); burst(e.x, e.y - 6, '#ffe25c', 8, 90); }
      } else hurtKnock(e.x);
    }
  }
}

function stepWorld(dt) {
  S.time += dt;
  updateMovers(dt);
  stepPlayer(dt);
  stepEnemies(dt);
  // tokens
  for (const k of tokens) if (!k.got && Math.abs(k.x - (pl.x + 7)) < 12 && k.y > pl.y - 6 && k.y < pl.y + pl.h + 4) {
    k.got = true; sfx('token'); addScore(100, k.x, k.y - 8); burst(k.x, k.y, PAL[k.z].acc, 6, 70);
  }
  // checkpoints / zones
  const z = Math.min(5, Math.floor((pl.x + 7) / (ZW * TS)));
  if (z > S.zone) {
    S.zone = z; S.banner = 2.8;
    if (z > 0) { sfx('zone'); addScore(500, pl.x, pl.y - 10, '#6ec8ff'); }
    const cp = checkpoints[z]; if (cp) { cp.on = true; pl.cpx = cp.x; }
  }
  S.banner -= dt;
  // goal
  if (pl.x + 7 >= gate.x && S.mode === 'play') {
    S.mode = 'win'; S.win = 0; musicStop(); sfx('win');
    const bonus = Math.max(0, Math.round(9000 - S.time * 60));
    S.bonus = bonus; S.score += bonus;
    S.rank = S.time < 55 ? 'ROOT ACCESS' : S.time < 75 ? 'SENIOR SRE' : S.time < 100 ? 'ON-CALL HERO' : 'INTERN WITH POTENTIAL';
    const li = document.getElementById('li'); li.href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(location.href.split('?')[0].split('#')[0]); li.hidden = false;
    try { const best = +localStorage.getItem('gq_best') || 0; S.best = Math.max(best, S.score); localStorage.setItem('gq_best', S.best); S.newBest = S.score >= best; } catch (e) { S.best = S.score; }
  }
  // camera
  const target = Math.max(0, Math.min(COLS * TS - W, pl.x + 7 - W * 0.4));
  S.cam += (target - S.cam) * Math.min(1, dt * 7);
}

function stepParticles(dt) {
  for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 0.9);
}

/* ====================================================================== bot (testing / teaser) */
let botDir = 0, botJump = false, botHold = false, botWait = 0;
function botThink(dt) {
  botDir = 1; botHold = true;
  if (S.mode !== 'play') return;
  const feet = pl.y + pl.h, cx = pl.x + 7;
  const col = Math.floor(cx / TS), row = Math.floor((feet + 2) / TS);
  // obstacle: wall ahead
  const wallAhead = solidAt(Math.floor((pl.x + pl.w + 10) / TS), Math.floor((feet - 8) / TS)) || solidAt(Math.floor((pl.x + pl.w + 10) / TS), Math.floor((feet - 24) / TS));
  // gap ahead: nothing under the next tile
  const nextCol = Math.floor((pl.x + pl.w + 6) / TS);
  let groundAhead = topSurfaceAt(nextCol, row) || topSurfaceAt(nextCol, row + 1);
  for (const m of movers) if (nextCol * TS + 8 > m.x && nextCol * TS + 8 < m.x + m.w && Math.abs(m.y - feet) < 10) groundAhead = true;
  const spikeAhead = [1, 2].some(d => at(Math.floor((pl.x + pl.w + d * 10) / TS), 14) === SPIKE) && Math.abs(feet - 240) < 4;
  let enemyAhead = false;
  for (const e of enemies) if (e.alive && e.x - cx > 0 && e.x - cx < 48 && Math.abs(e.y - feet) < 40) enemyAhead = true;
  // is there a landing spot within jump reach?
  const landing = () => {
    for (let dx = 2; dx <= 6; dx++) {
      const tx = col + dx;
      for (let ty = Math.max(0, row - 5); ty <= Math.min(ROWS - 1, row + 4); ty++) {
        if (topSurfaceAt(tx, ty) && !topSurfaceAt(tx, ty - 1) && at(tx, ty - 1) !== SPIKE && at(tx, ty) !== SPIKE) {
          if (at(tx, ty) === POD) { const p = (S.time + 0.35 + podPhase[ty * COLS + tx]) % 3.0; if (p > 1.7) continue; }
          return true;
        }
      }
    }
    for (const m of movers) {
      if (m === pl.ride) continue;
      for (const dt_ of [0.35, 0.45, 0.55]) {
        const u = 0.5 - 0.5 * Math.cos((((S.time + dt_) / m.period + m.phase / m.period) % 1) * Math.PI * 2);
        const fx = m.x0 + m.dx * u, fy = m.y0 + m.dy * u;
        const lx = cx + dt_ * 120;
        if (lx > fx + 8 && lx < fx + m.w - 8 && fy > feet - 70 && fy < feet + 40) return true;
      }
    }
    return false;
  };
  if (pl.onGround && pl.ride && !landing()) {
    const m = pl.ride, mid = m.x + m.w / 2;
    botDir = cx < mid - 6 ? 1 : (cx > mid + 6 ? -1 : 0);
    if (!groundAhead || cx > m.x + m.w - 14) return;
  }
  if (pl.onGround) {
    if (!groundAhead) {
      if (landing()) botJump = true; else { botDir = 0; }
    } else if (wallAhead || spikeAhead || enemyAhead) botJump = true;
  }
}

/* ====================================================================== drawing */
const lerp = (a, b, u) => a + (b - a) * u;
function hash(i) { let x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function sky(c0, c1) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

const BG = [
  // AI : neural network
  (cam, t) => {
    sky('#0d0826', '#2a0f52');
    const par = cam * 0.3, sp = 44;
    const i0 = Math.floor(par / sp) - 1;
    ctx.lineWidth = 1;
    for (let i = i0; i < i0 + W / sp + 3; i++) for (let j = 0; j < 5; j++) {
      const x = i * sp - par + hash(i * 7 + j) * 20, y = 24 + j * 38 + hash(i * 13 + j) * 16;
      const x2 = (i + 1) * sp - par + hash((i + 1) * 7 + ((j + 1) % 5)) * 20, y2 = 24 + ((j + 1) % 5) * 38 + hash((i + 1) * 13 + ((j + 1) % 5)) * 16;
      ctx.strokeStyle = 'rgba(110,200,255,.13)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
      const pul = 0.5 + 0.5 * Math.sin(t * 3 + i + j * 2);
      ctx.fillStyle = `rgba(180,155,255,${0.25 + 0.5 * pul})`; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
    }
  },
  // KUBERNETES : container stacks + hex sky
  (cam, t) => {
    sky('#061226', '#0d2b4f');
    const par = cam * 0.35, cw = 34;
    const cols = ['#1f6fa8', '#2a8a6a', '#a8572a', '#6a4aa8', '#2a5aa8'];
    for (let i = Math.floor(par / cw) - 1; i < Math.floor(par / cw) + W / cw + 2; i++) {
      const hgt = 2 + Math.floor(hash(i) * 4);
      for (let k = 0; k < hgt; k++) {
        const x = i * cw - par, y = 200 - k * 14;
        ctx.fillStyle = cols[Math.floor(hash(i * 3 + k) * 5)]; ctx.globalAlpha = 0.45; ctx.fillRect(Math.round(x), y, cw - 2, 13);
        ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let r = 4; r < cw - 4; r += 5) ctx.fillRect(Math.round(x) + r, y + 2, 1, 9);
        ctx.globalAlpha = 1;
      }
    }
  },
  // MULTICLOUD : sunset + clouds
  (cam, t) => {
    sky('#ffa45c', '#5a6fd8');
    ctx.fillStyle = 'rgba(255,240,200,.35)'; ctx.beginPath(); ctx.arc(300 - cam * 0.05 % 60, 70, 34, 0, Math.PI * 2); ctx.fill();
    for (const [pf, a, yb] of [[0.15, .35, 60], [0.4, .6, 120]]) {
      const par = cam * pf, sp = 120;
      for (let i = Math.floor(par / sp) - 1; i < Math.floor(par / sp) + 5; i++) {
        const x = i * sp - par + hash(i * 5) * 50, y = yb + hash(i * 9) * 40;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + k * 14, y - (k % 2) * 6, 13, 0, Math.PI * 2); ctx.fill(); }
      }
    }
  },
  // VIRTUALIZATION : rack rows
  (cam, t) => {
    sky('#140c05', '#3a2410');
    const par = cam * 0.4, rw = 26;
    for (let i = Math.floor(par / rw) - 1; i < Math.floor(par / rw) + W / rw + 2; i++) {
      const x = Math.round(i * rw - par), top = 70 + Math.floor(hash(i) * 30);
      ctx.fillStyle = '#20160c'; ctx.fillRect(x, top, rw - 3, 200 - top);
      for (let y = top + 6; y < 196; y += 8) {
        ctx.fillStyle = '#2e2214'; ctx.fillRect(x + 2, y, rw - 7, 5);
        const on = hash(i * 31 + y + Math.floor(t * 2 + hash(i + y) * 4)) > 0.5;
        ctx.fillStyle = on ? (hash(i + y) > 0.7 ? '#3ee07a' : '#ffb547') : '#3a2a18'; ctx.fillRect(x + rw - 8, y + 2, 2, 1);
      }
    }
  },
  // LINUX : terminal rain
  (cam, t) => {
    sky('#000500', '#001a06');
    const par = cam * 0.25, cw = 12;
    const glyphs = '$#>_/~01|{}[]*';
    for (let i = Math.floor(par / cw) - 1; i < Math.floor(par / cw) + W / cw + 2; i++) {
      const sp = 20 + hash(i) * 40, off = hash(i * 7) * 300;
      const head = (t * sp + off) % 340 - 40;
      for (let k = 0; k < 9; k++) {
        const y = head - k * 10;
        if (y < -10 || y > 230) continue;
        const ch = glyphs[Math.floor(hash(i * 17 + Math.floor((y + 400) / 10)) * glyphs.length)];
        text(ch, i * cw - par, y, k === 0 ? '#9dffb8' : `rgba(51,255,102,${0.5 - k * 0.05})`, 1);
      }
    }
  },
  // BERLIN : night skyline with the TV tower
  (cam, t) => {
    sky('#05081a', '#2a1048');
    for (let i = 0; i < 60; i++) { const x = (hash(i) * 600 - cam * 0.05) % W, y = hash(i * 3) * 150; ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * (0.5 + 0.5 * Math.sin(t * 2 + i))})`; ctx.fillRect(Math.round((x + W) % W), Math.round(y), 1, 1); }
    const par = cam * 0.3;
    const tx = (320 * TS + 20 * TS) * 0.3 - par + 60;
    ctx.fillStyle = '#1a1438';
    ctx.fillRect(Math.round(tx), 40, 4, 170); ctx.beginPath(); ctx.arc(tx + 2, 95, 11, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(Math.round(tx) - 2, 110, 8, 4); ctx.fillRect(Math.round(tx) + 1, 18, 2, 24);
    ctx.fillStyle = '#ff3b4e'; if (Math.floor(t * 2) % 2) ctx.fillRect(Math.round(tx) + 1, 17, 2, 2);
    for (let i = Math.floor(par / 30) - 1; i < Math.floor(par / 30) + W / 30 + 2; i++) {
      const x = Math.round(i * 30 - par), h = 40 + hash(i * 11) * 70;
      ctx.fillStyle = '#140f2e'; ctx.fillRect(x, 210 - h, 28, h);
      for (let y = 215 - h; y < 205; y += 7) for (let xx = 3; xx < 25; xx += 6) if (hash(i * 97 + y * 3 + xx) > 0.6) { ctx.fillStyle = hash(i + y + xx) > 0.5 ? '#ffb547' : '#6ec8ff'; ctx.fillRect(x + xx, y, 2, 2); }
    }
  },
];

function drawBackground(t) {
  const c = (S.cam + W / 2) / (ZW * TS);
  const z = Math.min(5, Math.floor(c)), f = c - Math.floor(c);
  BG[z](S.cam, t);
  if (z < 5 && f > 0.86) { ctx.globalAlpha = (f - 0.86) / 0.14; BG[z + 1](S.cam, t); ctx.globalAlpha = 1; }
}

function drawTiles() {
  const c0 = Math.floor(S.cam / TS), c1 = Math.min(COLS - 1, c0 + Math.ceil(W / TS) + 1);
  const ox = -Math.round(S.cam);
  for (let x = c0; x <= c1; x++) {
    const z = zoneOfCol(x), T_ = TILES[z];
    for (let y = 0; y < ROWS; y++) {
      const t = grid[y * COLS + x];
      if (!t) continue;
      const px = ox + x * TS, py = y * TS;
      if (t === SOLID) ctx.drawImage(at(x, y - 1) === SOLID ? T_.fill : T_.top, px, py);
      else if (t === ONEWAY) ctx.drawImage(T_.oneway, px, py);
      else if (t === SPIKE) ctx.drawImage(T_.spike, px, py);
      else if (t === POD) { const i = y * COLS + x; const on = podActive(i); if (on && !(podBlink(i) && Math.floor(S.time * 12) % 2)) ctx.drawImage(POD_ON, px, py); else ctx.drawImage(POD_OFF, px, py); }
    }
  }
}

function drawMovers() {
  for (const m of movers) {
    const x = Math.round(m.x - S.cam), y = Math.round(m.y);
    if (x > W || x + m.w < 0) continue;
    if (m.kind === 'cloud') {
      ctx.fillStyle = '#ffffff';
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + 7 + k * 11, y + 4 - (k % 2) * 3, 7, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillRect(x + 2, y + 2, m.w - 4, 7);
      ctx.fillStyle = '#c9d6f2'; ctx.fillRect(x + 3, y + 8, m.w - 6, 2);
    } else {
      ctx.fillStyle = '#4a3828'; ctx.fillRect(x, y, m.w, 10);
      ctx.fillStyle = '#ffb547'; ctx.fillRect(x, y, m.w, 2);
      ctx.fillStyle = '#16100a'; ctx.fillRect(x + 3, y + 4, m.w - 6, 4);
      text('VM', x + m.w / 2, y + 3, '#ffb547', 1, 'center');
      ctx.fillStyle = Math.floor(S.time * 4) % 2 ? '#3ee07a' : '#1a5a30'; ctx.fillRect(x + m.w - 5, y + 5, 2, 2);
    }
  }
}

function drawToken(k) {
  const x = Math.round(k.x - S.cam), y = Math.round(k.y + Math.sin(S.time * 4 + k.x) * 2);
  if (x < -10 || x > W + 10) return;
  const sq = Math.abs(Math.cos(S.time * 3 + k.x * 0.1));
  const w = Math.max(2, Math.round(10 * sq));
  const z = k.z;
  ctx.save(); ctx.translate(x, y);
  if (z === 0) { ctx.fillStyle = '#ffb547'; ctx.fillRect(-w / 2, -5, w, 10); ctx.fillStyle = '#7a4a10'; ctx.fillRect(-w / 2 + 2, -3, Math.max(0, w - 4), 6); ctx.fillStyle = '#ffe2a8'; for (let i = -4; i <= 4; i += 3) { ctx.fillRect(-w / 2 - 1, i, 1, 1); ctx.fillRect(w / 2, i, 1, 1); } }
  else if (z === 1) { ctx.fillStyle = ['#ff8a3a', '#4fd1ff', '#3ee07a'][Math.floor(k.x / 16) % 3]; ctx.fillRect(-w / 2, -4, w, 8); ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let i = -w / 2 + 2; i < w / 2; i += 3) ctx.fillRect(i, -3, 1, 6); }
  else if (z === 2) { ctx.fillStyle = '#ffffff'; ctx.fillRect(-w / 2, -4, w, 8); ctx.fillStyle = '#ff6aa0'; ctx.fillRect(-w / 2, -4, w, 1); if (w > 4) { ctx.fillRect(-w / 2 + 1, -3, 1, 1); ctx.fillRect(w / 2 - 2, -3, 1, 1); ctx.fillRect(-1, -1, 2, 1); } }
  else if (z === 3) { ctx.fillStyle = '#6ec8ff'; ctx.fillRect(-w / 2, -5, w, 10); ctx.fillStyle = '#16100a'; ctx.fillRect(-w / 2 + 1, -4, Math.max(0, w - 2), 3); ctx.fillStyle = '#e8f8ff'; ctx.fillRect(-w / 2 + 1, 1, Math.max(0, w - 2), 3); }
  else if (z === 4) { ctx.fillStyle = '#041208'; ctx.fillRect(-w / 2, -5, w, 10); ctx.strokeStyle = '#33ff66'; ctx.strokeRect(-w / 2 + .5, -4.5, w - 1, 9); if (w > 6) text('>_', -5, -3, '#33ff66', 1); }
  else { ctx.fillStyle = '#ffe25c'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(w / 2, 0); ctx.lineTo(0, 6); ctx.lineTo(-w / 2, 0); ctx.fill(); }
  ctx.restore();
}

function drawEnemy(e) {
  const x = Math.round(e.x - S.cam), y = Math.round(e.y);
  if (x < -30 || x > W + 30) return;
  if (!e.alive) {
    if (e.dead < 0.35) { ctx.globalAlpha = 1 - e.dead / 0.35; ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 7, y - 3, 14, 3); ctx.globalAlpha = 1; }
    return;
  }
  const t = e.t;
  if (e.type === 'ghost') {
    ctx.fillStyle = 'rgba(200,180,255,.85)';
    ctx.beginPath(); ctx.arc(x, y - 9, 7, Math.PI, 0); ctx.lineTo(x + 7, y); for (let k = 0; k < 4; k++) ctx.lineTo(x + 7 - k * 3.5 - 1.75, y - (k % 2 ? 0 : 3) - (Math.floor(t * 6) % 2)); ctx.lineTo(x - 7, y); ctx.fill();
    text('?', x - 5, y - 13, '#2a0f52', 1); text('?', x + 1, y - 13, '#2a0f52', 1);
  } else if (e.type === 'crash') {
    ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x - 6, y - 10, 12, 10);
    ctx.fillStyle = '#ffd0d4'; ctx.fillRect(x - 4, y - 8, 2, 2); ctx.fillRect(x + 2, y - 8, 2, 2);
    ctx.fillStyle = '#5a0a14'; ctx.fillRect(x - 3, y - 4, 6, 1);
    ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x - 6, y - 12, 2, 2); ctx.fillRect(x + 4, y - 12, 2, 2);
  } else if (e.type === 'fee') {
    const flap = Math.floor(t * 10) % 2;
    ctx.fillStyle = '#ffe25c'; ctx.beginPath(); ctx.arc(x, y - 6, 6, 0, Math.PI * 2); ctx.fill();
    text('$', x - 2, y - 10, '#7a5a00', 1);
    ctx.fillStyle = '#ff6aa0'; ctx.fillRect(x - 12, y - 8 - flap * 3, 6, 2); ctx.fillRect(x + 6, y - 8 - flap * 3, 6, 2);
  } else if (e.type === 'noisy') {
    ctx.fillStyle = '#6a5038'; ctx.fillRect(x - 7, y - 14, 14, 14);
    ctx.fillStyle = '#ffb547'; ctx.fillRect(x - 7, y - 14, 14, 2);
    ctx.fillStyle = '#16100a'; ctx.beginPath(); ctx.arc(x, y - 6, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffb547'; if (Math.floor(t * 8) % 2) { ctx.fillRect(x + 9, y - 10, 1, 3); ctx.fillRect(x + 11, y - 12, 1, 7); }
  } else if (e.type === 'segfault') {
    const leg = Math.floor(t * 10) % 2;
    ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x - 6, y - 8, 12, 6);
    ctx.fillStyle = '#2a0006'; ctx.fillRect(x - 1, y - 8, 1, 6);
    ctx.fillStyle = '#ff9aa6'; ctx.fillRect(Math.sign(e.vx) > 0 ? x + 4 : x - 6, y - 7, 2, 2);
    ctx.fillStyle = '#5a0a14'; for (let k = -1; k <= 1; k++) { ctx.fillRect(x + k * 4 - 1, y - 2 + (leg ^ (k & 1)), 1, 2); }
  }
}

function drawCheckpoints() {
  for (const c of checkpoints) {
    const x = Math.round(c.x - S.cam), y = c.y;
    if (x < -20 || x > W + 20) continue;
    ctx.fillStyle = '#2a3458'; ctx.fillRect(x - 2, y - 26, 4, 26);
    ctx.fillStyle = c.on ? '#3ee07a' : '#ff3b4e';
    ctx.fillRect(x - 4, y - 32, 8, 6);
    if (c.on) { ctx.globalAlpha = 0.25 + 0.2 * Math.sin(S.time * 6); ctx.beginPath(); ctx.arc(x, y - 29, 9, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  }
}

function drawGate() {
  const x = Math.round(gate.x - S.cam), y = gate.y;
  if (x < -80 || x > W + 80) return;
  const glow = 0.6 + 0.4 * Math.sin(S.time * 5);
  ctx.save();
  ctx.shadowColor = '#6ec8ff'; ctx.shadowBlur = 8 * glow;
  ctx.fillStyle = '#1a2440';
  ctx.fillRect(x - 40, y - 96, 10, 96); ctx.fillRect(x + 30, y - 96, 10, 96); ctx.fillRect(x - 46, y - 112, 92, 18);
  ctx.strokeStyle = '#6ec8ff'; ctx.lineWidth = 1;
  ctx.strokeRect(x - 39.5, y - 95.5, 9, 95); ctx.strokeRect(x + 30.5, y - 95.5, 9, 95); ctx.strokeRect(x - 45.5, y - 111.5, 91, 17);
  ctx.restore();
  text('GTC BERLIN', x, y - 107, Math.floor(S.time * 3) % 2 ? '#ffb547' : '#ffe25c', 1, 'center');
  ctx.fillStyle = `rgba(110,200,255,${0.08 + 0.06 * glow})`; ctx.fillRect(x - 30, y - 94, 60, 94);
}

function drawPlayer() {
  if (pl.inv > 0 && Math.floor(pl.inv * 16) % 2 && S.mode === 'play') return;
  let fr;
  if (S.mode === 'win') fr = S.win < 0.4 ? 'land' : (Math.floor(S.win * 3) % 4 === 3 ? 'wink' : 'cheer');
  else if (!pl.onGround) fr = pl.vy < 0 ? 'jump' : 'fall';
  else if (pl.land > 0) fr = 'land';
  else if (Math.abs(pl.vx) > 8) fr = 'run' + (Math.floor(pl.dist / 9) % 4);
  else fr = 'idle' + (Math.floor(S.t * 2.5) % 2);
  const front = fr === 'cheer' || fr === 'wink';
  const sx = FR[fr] * SW;
  const px = Math.round(pl.x - S.cam + 7), py = Math.round(pl.y + pl.h);
  ctx.save();
  ctx.translate(px, py);
  if (pl.face < 0 && !front) ctx.scale(-1, 1);
  const bounce = S.mode === 'win' && fr === 'cheer' ? -Math.abs(Math.sin(S.win * 6)) * 6 : 0;
  ctx.drawImage(SPR, sx, 0, SW, SH, -18, -44 + bounce, SW, SH);
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x - S.cam), Math.round(p.y), 2, 2); }
  ctx.globalAlpha = 1;
  for (const p of pops) text(p.s, p.x - S.cam, p.y - p.t * 30, p.col, 1, 'center');
}

const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, 14);
  text('SCORE ' + String(S.score).padStart(6, '0'), 4, 3, '#e8eefc', 1);
  text('TIME ' + fmtTime(S.time), W / 2, 3, '#ffe25c', 1, 'center');
  const z = Math.max(0, S.zone);
  text(z < 5 ? (z + 1) + '/5 ' + ZONES[z].name : 'BERLIN', W - 4, 3, PAL[z].top === '#ffffff' ? '#ff6aa0' : PAL[z].top, 1, 'right');
  if (S.banner > 0 && S.zone >= 0) {
    const a = Math.min(1, S.banner / 0.4, (2.8 - S.banner) / 0.25);
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'rgba(4,8,20,.78)'; ctx.fillRect(0, 44, W, 50);
    ctx.fillStyle = PAL[S.zone].top; ctx.fillRect(0, 44, W, 1); ctx.fillRect(0, 93, W, 1);
    text(S.zone < 5 ? 'ZONE ' + (S.zone + 1) : 'FINAL STRETCH', W / 2, 49, '#ffb547', 1, 'center');
    text(ZONES[S.zone].name, W / 2, 60, '#ffffff', 2, 'center');
    text(ZONES[S.zone].tip, W / 2, 81, '#9fb0d8', 1, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ====================================================================== screens */
let fw = [];
function drawTitle(t) {
  BG[5](t * 40, t);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, H);
  const cols = ['#9b7bff', '#4fd1ff', '#ffffff', '#ffb547', '#33ff66'];
  for (let i = 0; i < 5; i++) { ctx.fillStyle = cols[i]; ctx.fillRect(0, 230 + i * 3, W, 2); }
  text('GECKO QUEST', W / 2, 30, '#ffe25c', 4, 'center');
  text('ROAD TO GTC BERLIN', W / 2, 72, '#6ec8ff', 2, 'center');
  const bob = Math.round(Math.sin(t * 3) * 3);
  ctx.drawImage(SPR, FR[Math.floor(t * 1.2) % 5 === 4 ? 'wink' : 'front'] * SW, 0, SW, SH, W / 2 - SW, 100 + bob, SW * 2, SH * 2);
  text('AI · KUBERNETES · MULTICLOUD · VIRTUALIZATION · LINUX', W / 2, 200, '#c8d4f0', 1, 'center');
  if (Math.floor(t * 2.2) % 2 === 0) text(document.body.classList.contains('coarse') ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 214, '#ffffff', 1, 'center');
  text('A mini game by Cyril Cuvier', W / 2, H - 14, '#7f8db2', 1, 'center');
  try { const b = +localStorage.getItem('gq_best') || 0; if (b) text('BEST ' + b, W - 4, 4, '#ffb547', 1, 'right'); } catch (e) {}
}

const BTN = { again: { x: 52, y: 238, w: 128, h: 24, label: 'PLAY AGAIN' }, share: { x: 204, y: 238, w: 128, h: 24, label: 'SHARE SCORE' } };
function drawWin(dt) {
  S.win += dt;
  if (Math.random() < dt * 6) { const x = S.cam + 40 + Math.random() * (W - 80), y = 30 + Math.random() * 90; const c = ['#ffb547', '#6ec8ff', '#3ee07a', '#ff3ea5', '#ffe25c'][Math.floor(Math.random() * 5)]; burst(x, y, c, 22, 140); sfxPop(); }
  const a = Math.min(1, Math.max(0, (S.win - 0.8) / 0.4));
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(4,8,20,.86)'; ctx.fillRect(20, 26, W - 40, H - 44);
  ctx.strokeStyle = '#6ec8ff'; ctx.strokeRect(20.5, 26.5, W - 41, H - 45);
  text('QUEST COMPLETE!', W / 2, 36, '#ffe25c', 3, 'center');
  text('SCORE ' + S.score + (S.newBest ? '  NEW BEST!' : ''), W / 2, 70, '#ffffff', 2, 'center');
  text('TIME ' + fmtTime(S.time) + '   TIME BONUS +' + S.bonus, W / 2, 92, '#c8d4f0', 1, 'center');
  text('RANK: ' + S.rank, W / 2, 106, '#ffb547', 1, 'center');
  ctx.fillStyle = '#24345c'; ctx.fillRect(40, 124, W - 80, 1);
  text('SEE YOU AT', W / 2, 136, '#9fb0d8', 1, 'center');
  text('NVIDIA GTC BERLIN', W / 2, 150, '#3ee07a', 2, 'center');
  text('CONFERENCE & EXPO · OCTOBER 21–22, 2026', W / 2, 174, '#e8eefc', 1, 'center');
  text('STATION BERLIN', W / 2, 186, '#9fb0d8', 1, 'center');
  text('Come say hi. Bring your toughest infra question.', W / 2, 204, '#c8d4f0', 1, 'center');
  for (const k of ['again', 'share']) {
    const b = BTN[k];
    ctx.fillStyle = k === 'share' ? '#ffb547' : '#24345c'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(b.x, b.y, b.w, 1);
    text(b.label, b.x + b.w / 2, b.y + 8, k === 'share' ? '#2a1600' : '#ffffff', 1, 'center');
  }
  if (toast && toast.t > 0) text(toast.s, W / 2, 268, '#3ee07a', 1, 'center');
  ctx.globalAlpha = 1;
}
let popClock = 0;
function sfxPop() { if (!AC || muted) return; const t = AC.currentTime; if (t - popClock < 0.15) return; popClock = t; noise(t, 0.25, { vol: 0.07, hp: 1500 }); }

async function share() {
  const url = location.href.split('?')[0].split('#')[0];
  const msg = `I got my gecko to NVIDIA GTC Berlin in ${fmtTime(S.time)} with ${S.score} pts (rank: ${S.rank}). Can you beat it? 🦎`;
  try { await navigator.clipboard.writeText(msg + ' ' + url); toast = { s: 'SCORE COPIED - PASTE IT IN YOUR POST', t: 3 }; } catch (e) { toast = { s: 'OPENING LINKEDIN...', t: 3 }; }
  if (navigator.share && document.body.classList.contains('coarse')) { try { await navigator.share({ title: 'Gecko Quest', text: msg, url }); return; } catch (e) {} }
  try { window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url), '_blank', 'noopener'); } catch (e) {}
}

function debugWarp(z) { if (S.mode !== 'play') reset(); const c = checkpoints[z]; if (!c) return; pl.cpx = c.x; S.zone = z - 1; respawn(true); S.cam = Math.max(0, pl.x - W * 0.4); }

/* ====================================================================== main loop */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.t += dt;
  musicTick();
  if (toast) toast.t -= dt;
  if (S.mode === 'title') {
    drawTitle(S.t);
    if (anyPress || BOT) { anyPress = false; tap = null; audioInit(); reset(); musicStart(); }
  } else {
    if (S.mode === 'play') {
      acc += dt;
      while (acc >= STEP) { if (BOT) botThink(STEP); stepWorld(STEP); acc -= STEP; }
    } else { acc = 0; }
    stepParticles(dt);
    S.shake = Math.max(0, S.shake - dt);
    ctx.save();
    if (S.shake > 0) ctx.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 4));
    drawBackground(S.t);
    drawTiles(); drawMovers(); drawCheckpoints(); drawGate();
    for (const k of tokens) if (!k.got) drawToken(k);
    for (const e of enemies) drawEnemy(e);
    drawPlayer(); drawParticles();
    ctx.restore();
    drawHUD();
    if (S.mode === 'win') {
      drawWin(dt);
    }
  }
  tap = null; anyPress = false;
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); last = performance.now(); });
setMuted(muted);
SPR.onload = () => requestAnimationFrame(frame);
window.__G = { S, pl, get tokens() { return tokens; }, get enemies() { return enemies; } };
</script>
