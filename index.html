<style>
  :root {
    --bg: #0b0614;
    --shell: #1d0f2e;
    --shell-hi: #32194d;
    --ink: #f0e8fc;
    --muted: #a493c4;
    --amber: #ff8a1c;
    --line: #4a2a6a;
    --focus: #ffd23c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }
  #app {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-block: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-bottom)); padding-inline: 16px;
    gap: 10px;
  }
  #shell {
    background: linear-gradient(180deg, var(--shell-hi), var(--shell));
    border-radius: 18px 18px 18px 48px; padding: 12px 12px 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 40px rgba(255,138,28,.08), inset 0 1px 0 rgba(255,255,255,.08);
    width: min(100%, 984px, calc((100dvh - var(--padh)) * 4 / 3 + 24px));
  }
  :root { --padh: 130px; }
  @media (pointer: coarse) and (orientation: portrait) { :root { --padh: 300px; } }
  #screen { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
  #bar b { color: var(--amber); font-weight: 700; }
  #mute:focus-visible, .btn:focus-visible, #li:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #li { color: var(--amber); font-weight: 700; text-decoration: none; letter-spacing: .06em; }
  #mute { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 11px; cursor: pointer; }
  #pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; padding: 4px 10px 0; }
  .coarse #pad { display: flex; }
  .coarse #keys { display: none; }
  .dpad { display: flex; gap: 14px; }
  .btn {
    width: 78px; height: 78px; border-radius: 50%; border: none; font: inherit; font-size: 26px; font-weight: 700;
    color: var(--ink); background: radial-gradient(circle at 35% 30%, #5a3480, #2a1640);
    box-shadow: 0 6px 0 #120820, 0 10px 18px rgba(0,0,0,.45); touch-action: none;
  }
  .btn.dir { border-radius: 18px; width: 74px; }
  .btn.a { width: 92px; height: 92px; background: radial-gradient(circle at 35% 30%, #ffb05a, #d8600c); color: #2a1000; }
  .btn.on { transform: translateY(4px); box-shadow: 0 2px 0 #120820, 0 4px 10px rgba(0,0,0,.4); }
  @media (pointer: coarse) and (orientation: landscape) {
    #app { flex-direction: row; gap: 14px; }
    #pad { position: fixed; inset: auto 0 12px 0; width: 100%; pointer-events: none; padding: 0 18px; }
    #pad > * { pointer-events: auto; }
    .btn { opacity: .82; }
  }
</style>

      else if (t === POD) { const i = y * COLS + x; const on = podActive(i); if (on && !(podBlink(i) && Math.floor(S.time * 12) % 2)) ctx.drawImage(POD_ON, px, py); else ctx.drawImage(POD_OFF, px, py); }

  } else if (k.z === 4) {
    ctx.fillStyle = 'rgba(51,255,102,.2)'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8ffd0'; ctx.fillRect(-w / 2, -5, w, 7); ctx.fillRect(-w / 2 + 2, 2, Math.max(1, w - 4), 2);
    if (w > 5) { ctx.fillStyle = '#041208'; ctx.fillRect(-3, -3, 2, 2); ctx.fillRect(1, -3, 2, 2); ctx.fillRect(-1, 3, 1, 1); ctx.fillRect(1, 3, 1, 1); }
  } else {
    drawPumpkin(0, 5, 0.9, S.time + k.x);
  }
  ctx.restore();
}

function drawPotion(p) {
  const x = Math.round(p.x - S.cam), y = Math.round(p.y + Math.sin(S.time * 3 + p.x) * 2);
  if (x < -12 || x > W + 12) return;
  ctx.fillStyle = 'rgba(125,255,90,.16)'; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c8b8e8'; ctx.fillRect(x - 2, y - 8, 4, 4);
  ctx.fillStyle = '#8a5a30'; ctx.fillRect(x - 2, y - 10, 4, 2);
  ctx.fillStyle = '#7dff5a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x - 2, y - 1, 2, 2); ctx.fillRect(x + 1, y - 1, 2, 2); ctx.fillRect(x - 1, y + 1, 3, 1); ctx.fillRect(x, y + 2, 1, 1);
  ctx.fillStyle = '#e8ffd8'; ctx.fillRect(x - 3, y - 3, 1, 1); if (Math.floor(S.time * 4 + p.x) % 2) ctx.fillRect(x + 2, y - 6, 1, 1);
}

function drawSpider(x, y, t, f, moving) {
  const leg = moving ? Math.floor(t * 12) % 2 : 0;
  ctx.fillStyle = '#8a3a6a';
  for (let k = -1; k <= 2; k++) { const lx = x + k * 3 - 2; ctx.fillRect(lx - 4, y - 5 + ((leg + k) & 1), 3, 1); ctx.fillRect(lx - 5, y - 4 + ((leg + k) & 1), 1, 4); ctx.fillRect(lx + 3, y - 5 + ((leg + k + 1) & 1), 3, 1); ctx.fillRect(lx + 6, y - 4 + ((leg + k + 1) & 1), 1, 4); }
  ctx.fillStyle = '#4a1238'; ctx.beginPath(); ctx.ellipse(x, y - 4, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6a1a4a'; ctx.beginPath(); ctx.arc(x + f * 5, y - 4, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x + f * 5 - 1, y - 5, 1, 1); ctx.fillRect(x + f * 5 + 1, y - 5, 1, 1); ctx.fillRect(x - 1, y - 6, 2, 2);
}

function drawEnemy(e) {
  const x = Math.round(e.x - S.cam), y = Math.round(e.y);
  if (x < -30 || x > W + 30) return;
  if (!e.alive) {
    if (e.dead < 0.35) { ctx.globalAlpha = 1 - e.dead / 0.35; ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 7, y - 3, 14, 3); ctx.globalAlpha = 1; }
    if (e.revive && e.dead > 2.4) { const j = Math.floor(e.dead * 12) % 2; ctx.fillStyle = '#3a6a2a'; ctx.fillRect(x - 6 + j, y - 2, 12, 2); ctx.fillStyle = '#7dff5a'; ctx.fillRect(x - 4 + j, y - 3, 2, 1); ctx.fillRect(x + 2 - j, y - 3, 2, 1); }
    return;
  }
  const t = e.t;
  ctx.save();
  if (e.rise > 0) { ctx.beginPath(); ctx.rect(x - 20, y - 40, 40, 40); ctx.clip(); ctx.translate(0, Math.round(e.rise / 0.6 * 13)); }
  if (e.type === 'ghost') {
    ctx.fillStyle = 'rgba(236,228,255,.9)';
    ctx.beginPath(); ctx.arc(x, y - 9, 7, Math.PI, 0); ctx.lineTo(x + 7, y);
    for (let k = 0; k < 4; k++) ctx.lineTo(x + 7 - k * 3.5 - 1.75, y - (k % 2 ? 0 : 3) - (Math.floor(t * 6) % 2));
    ctx.lineTo(x - 7, y); ctx.fill();
    text('?', x - 5, y - 13, '#2a0f52', 1); text('?', x + 1, y - 13, '#2a0f52', 1);
  } else if (e.type === 'wraith') {
    ctx.globalAlpha = 0.78 + 0.18 * Math.sin(t * 9);
    ctx.fillStyle = '#2a1040';
    ctx.beginPath(); ctx.moveTo(x, y - 19); ctx.quadraticCurveTo(x + 10, y - 16, x + 8, y - 3);
    for (let k = 0; k < 5; k++) ctx.lineTo(x + 8 - k * 4 - 2, y - ((k + Math.floor(t * 8)) % 2 ? 0 : 4));
    ctx.lineTo(x - 8, y - 3); ctx.quadraticCurveTo(x - 10, y - 16, x, y - 19); ctx.fill();
    ctx.fillStyle = '#0a0410'; ctx.beginPath(); ctx.ellipse(x + (e.face || -1) * 2, y - 12, 4, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x + (e.face || -1) * 2 - 3, y - 13, 2, 1); ctx.fillRect(x + (e.face || -1) * 2 + 1, y - 13, 2, 1);
  } else if (e.type === 'zombie') {
    const f = Math.sign(e.vx) || -1;
    ctx.fillStyle = '#4a8a3a'; ctx.fillRect(x - 6, y - 12, 12, 12);
    ctx.fillStyle = '#2f5a24'; ctx.fillRect(x - 6, y - 12, 12, 2); ctx.fillRect(x - 6, y - 1, 12, 1);
    const wob = Math.floor(t * 6) % 2;
    ctx.fillStyle = '#4a8a3a'; ctx.fillRect(f > 0 ? x + 6 : x - 10, y - 8 + wob, 4, 2); ctx.fillRect(f > 0 ? x + 6 : x - 10, y - 5 - wob, 4, 2);
    ctx.fillStyle = '#e8ffd0'; ctx.fillRect(x + f * 2 - 1, y - 9, 3, 3); ctx.fillRect(x - f * 3 - 1, y - 8, 2, 2);
    ctx.fillStyle = '#1a0a0a'; ctx.fillRect(x + f * 2, y - 8, 1, 1); ctx.fillRect(x - 4, y - 4, 8, 2);
    ctx.fillStyle = '#e8ffd0'; ctx.fillRect(x - 3, y - 4, 1, 2); ctx.fillRect(x, y - 4, 1, 2); ctx.fillRect(x + 3, y - 4, 1, 2);
  } else if (e.type === 'bat') {
    const flap = Math.floor(t * (e.st === 'dive' ? 20 : 12)) % 2;
    ctx.fillStyle = '#3a1a52';
    if (flap) { ctx.beginPath(); ctx.moveTo(x - 3, y - 6); ctx.lineTo(x - 13, y - 12); ctx.lineTo(x - 10, y - 5); ctx.lineTo(x - 6, y - 4); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 3, y - 6); ctx.lineTo(x + 13, y - 12); ctx.lineTo(x + 10, y - 5); ctx.lineTo(x + 6, y - 4); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(x - 3, y - 6); ctx.lineTo(x - 13, y - 2); ctx.lineTo(x - 9, y - 3); ctx.lineTo(x - 6, y); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + 3, y - 6); ctx.lineTo(x + 13, y - 2); ctx.lineTo(x + 9, y - 3); ctx.lineTo(x + 6, y); ctx.fill(); }
    ctx.fillStyle = '#4a2266'; ctx.beginPath(); ctx.arc(x, y - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - 4, y - 11, 2, 3); ctx.fillRect(x + 2, y - 11, 2, 3);
    ctx.fillStyle = '#ff3b4e'; ctx.fillRect(x - 3, y - 7, 2, 1); ctx.fillRect(x + 1, y - 7, 2, 1);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 2, y - 3, 1, 2); ctx.fillRect(x + 1, y - 3, 1, 2);
  } else if (e.type === 'pumpkin') {
    drawPumpkin(x, y, 1.45, t * 2);
    ctx.fillStyle = '#5a1a00'; ctx.fillRect(x - 5, y - 10, 3, 1); ctx.fillRect(x + 2, y - 10, 3, 1);
  } else if (e.type === 'spider') {
    drawSpider(x, y, t, Math.sign(e.vx) || -1, true);
  } else if (e.type === 'dropper') {
    ctx.fillStyle = 'rgba(230,230,240,.55)'; ctx.fillRect(x, Math.round(e.top), 1, Math.max(0, y - 6 - Math.round(e.top)));
    drawSpider(x, y, t, 1, false);
  }
  ctx.restore();
}

function drawCheckpoints() {
  for (const c of checkpoints) {
    const x = Math.round(c.x - S.cam), y = c.y;
    if (x < -20 || x > W + 20) continue;
    ctx.fillStyle = '#4a4458'; ctx.fillRect(x - 6, y - 14, 12, 14); ctx.beginPath(); ctx.arc(x, y - 14, 6, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#5e5870'; ctx.fillRect(x - 6, y - 14, 2, 14);
    ctx.fillStyle = '#2a2632'; ctx.fillRect(x - 1, y - 16, 2, 9); ctx.fillRect(x - 3, y - 14, 6, 2);
    ctx.fillStyle = '#e8dcc0'; ctx.fillRect(x - 1, y - 25, 3, 5);
    if (c.on) {
      const fl = Math.floor(S.time * 10) % 3;
      ctx.globalAlpha = 0.22 + 0.12 * Math.sin(S.time * 6); ctx.fillStyle = '#7dff5a'; ctx.beginPath(); ctx.arc(x, y - 28, 9, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = fl ? '#7dff5a' : '#c8ffb0'; ctx.fillRect(x - 1, y - 29 - (fl === 2 ? 1 : 0), 3, 4); ctx.fillRect(x, y - 31, 1, 2);
    } else { ctx.fillStyle = '#5a5060'; ctx.fillRect(x, y - 27, 1, 2); }
  }
}

function drawGate() {
  const x = Math.round(gate.x - S.cam), y = gate.y;
  if (x < -90 || x > W + 90) return;
  const glow = 0.6 + 0.4 * Math.sin(S.time * 5);
  ctx.fillStyle = `rgba(255,138,28,${0.2 + 0.14 * glow})`;
  ctx.beginPath(); ctx.moveTo(x - 28, y); ctx.lineTo(x - 28, y - 84); ctx.lineTo(x, y - 104); ctx.lineTo(x + 28, y - 84); ctx.lineTo(x + 28, y); ctx.fill();
  ctx.fillStyle = '#2a2234';
  ctx.fillRect(x - 40, y - 84, 12, 84); ctx.fillRect(x + 28, y - 84, 12, 84);
  ctx.beginPath(); ctx.moveTo(x - 40, y - 84); ctx.lineTo(x, y - 118); ctx.lineTo(x + 40, y - 84); ctx.lineTo(x + 28, y - 84); ctx.lineTo(x, y - 104); ctx.lineTo(x - 28, y - 84); ctx.fill();
  ctx.fillStyle = '#1a1420'; for (let k = 0; k < 84; k += 12) { ctx.fillRect(x - 40, y - k - 1, 12, 1); ctx.fillRect(x + 28, y - k - 7, 12, 1); }
  ctx.fillStyle = '#3e344c'; ctx.fillRect(x - 40, y - 84, 2, 84); ctx.fillRect(x + 28, y - 84, 2, 84);
  ctx.fillStyle = '#5a4630'; ctx.fillRect(x - 31, y - 132, 1, 16); ctx.fillRect(x + 30, y - 132, 1, 16);
  ctx.fillStyle = '#1a0e08'; ctx.fillRect(x - 47, y - 140, 94, 14); ctx.strokeStyle = '#ff8a1c'; ctx.lineWidth = 1; ctx.strokeRect(x - 46.5, y - 139.5, 93, 13);
  text('TRICK OR TREAT', x, y - 137, Math.floor(S.time * 3) % 2 ? '#ff8a1c' : '#ffb547', 1, 'center');
  drawPumpkin(x - 52, y, 1.6, S.t); drawPumpkin(x + 52, y, 1.6, S.t + 1.3);
}

function drawPlayer() {
  if (pl.inv > 0 && Math.floor(pl.inv * 16) % 2 && S.mode === 'play') return;
  let fr;
  if (S.mode === 'win') fr = S.win < 0.4 ? 'land' : (Math.floor(S.win * 3) % 4 === 3 ? 'wink' : 'cheer');
  else if (!pl.onGround) fr = pl.vy < 0 ? 'jump' : 'fall';
  else if (pl.land > 0) fr = 'land';
  else if (Math.abs(pl.vx) > 8) fr = 'run' + (Math.floor(pl.dist / 9) % 4);
  else fr = 'idle' + (Math.floor(S.t * 2.5) % 2);
  const front = fr === 'cheer' || fr === 'wink';
  const sx = FR[fr] * SW;
  const px = Math.round(pl.x - S.cam + 7), py = Math.round(pl.y + pl.h);
  ctx.save();
  ctx.translate(px, py);
  if (pl.face < 0 && !front) ctx.scale(-1, 1);
  const bounce = S.mode === 'win' && fr === 'cheer' ? -Math.abs(Math.sin(S.win * 6)) * 6 : 0;
  ctx.drawImage(SPR, sx, 0, SW, SH, -18, -(SH - 2) + bounce, SW, SH);
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x - S.cam), Math.round(p.y), 2, 2); }
  ctx.globalAlpha = 1;
  for (const s of souls) {
    const x = Math.round(s.x - S.cam + Math.sin(s.t * 6) * 3), y = Math.round(s.y - s.t * 40);
    ctx.globalAlpha = Math.max(0, 1 - s.t / 1.4);
    ctx.fillStyle = '#ece4ff'; ctx.beginPath(); ctx.arc(x, y - 5, 5, Math.PI, 0); ctx.lineTo(x + 5, y + 2); ctx.lineTo(x + 2, y); ctx.lineTo(x, y + 2); ctx.lineTo(x - 2, y); ctx.lineTo(x - 5, y + 2); ctx.fill();
    ctx.fillStyle = '#2a0f52'; ctx.fillRect(x - 2, y - 5, 1, 2); ctx.fillRect(x + 1, y - 5, 1, 2);
    ctx.globalAlpha = 1;
  }
  for (const p of pops) text(p.s, p.x - S.cam, p.y - p.t * 30, p.col, 1, 'center');
}

const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, 14);
  text('SCORE ' + String(S.score).padStart(6, '0'), 4, 3, '#f0e8fc', 1);
  for (let i = 0; i < MAXHP; i++) text('♥', 84 + i * 7, 3, i < pl.hp ? '#ff3b4e' : '#3a2440', 1);
  text('TIME ' + fmtTime(S.time), W / 2, 3, '#ffb547', 1, 'center');
  const z = Math.max(0, S.zone);
  text(z < 5 ? (z + 1) + '/5 ' + ZONES[z].name : 'MIDNIGHT', W - 4, 3, PAL[z].top, 1, 'right');
  if (S.banner > 0 && S.zone >= 0) {
    const a = Math.min(1, S.banner / 0.4, (2.8 - S.banner) / 0.25);
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = 'rgba(10,4,20,.82)'; ctx.fillRect(0, 44, W, 50);
    ctx.fillStyle = PAL[S.zone].top; ctx.fillRect(0, 44, W, 1); ctx.fillRect(0, 93, W, 1);
    text(S.zone < 5 ? 'ZONE ' + (S.zone + 1) : 'FINAL STRETCH', W / 2, 49, '#ff8a1c', 1, 'center');
    text(ZONES[S.zone].name, W / 2, 60, '#ffffff', 2, 'center');
    text(ZONES[S.zone].tip, W / 2, 81, '#c8b8e8', 1, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ====================================================================== screens */
function drawTitle(t) {
  BG[5](t * 20, t, 290);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#120818'; ctx.fillRect(0, 183, W, H - 183);
  ctx.fillStyle = '#3a1a4a'; ctx.fillRect(0, 183, W, 1);
  const fl = Math.sin(t * 11) * Math.sin(t * 5.3) > 0.6;
  text('GECKO QUEST', W / 2, 16, fl ? '#ffb547' : '#ff8a1c', 4, 'center');
  text('HALLOWEEN EDITION', W / 2, 55, '#b06cff', 2, 'center');
  const bob = Math.round(Math.sin(t * 3) * 3);
  ctx.drawImage(SPR, FR[Math.floor(t * 1.2) % 5 === 4 ? 'wink' : 'front'] * SW, 0, SW, SH, W / 2 - SW, 74 + bob, SW * 2, SH * 2);
  drawPumpkin(W / 2 - 62, 183, 2.2, t); drawPumpkin(W / 2 + 64, 183, 1.8, t + 2);
  deadTree(36, 183, 70, '#0a0410');
  text('AI · KUBERNETES · MULTICLOUD · VIRTUALIZATION · LINUX', W / 2, 193, '#c8b8e8', 1, 'center');
  text('5 HAUNTED WORLDS · 3 HEARTS · NO MERCY', W / 2, 206, '#ff8a1c', 1, 'center');
  if (Math.floor(t * 2.2) % 2 === 0) text(document.body.classList.contains('coarse') ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, 228, '#ffffff', 1, 'center');
  text('A mini game by Cyril Cuvier', W / 2, H - 14, '#8a7aa8', 1, 'center');
  try { const b = +localStorage.getItem('gqh_best') || 0; if (b) text('BEST ' + b, W - 4, 4, '#ffb547', 1, 'right'); } catch (e) {}
}

const BTN = { again: { x: 52, y: 238, w: 128, h: 24, label: 'PLAY AGAIN' }, share: { x: 204, y: 238, w: 128, h: 24, label: 'SHARE SCORE' } };
function drawWin(dt) {
  S.win += dt;
  if (Math.random() < dt * 6) { const x = S.cam + 40 + Math.random() * (W - 80), y = 30 + Math.random() * 90; const c = ['#ff8a1c', '#b06cff', '#7dff5a', '#ffd23c', '#ff3ea5'][Math.floor(Math.random() * 5)]; burst(x, y, c, 22, 140); sfxPop(); }
  const a = Math.min(1, Math.max(0, (S.win - 0.8) / 0.4));
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(10,4,20,.95)'; ctx.fillRect(20, 26, W - 40, H - 44);
  ctx.strokeStyle = '#ff8a1c'; ctx.lineWidth = 1; ctx.strokeRect(20.5, 26.5, W - 41, H - 45);
  text('YOU SURVIVED!', W / 2, 36, '#ff8a1c', 3, 'center');
  text('SCORE ' + S.score + (S.newBest ? '  NEW BEST!' : ''), W / 2, 68, '#ffffff', 2, 'center');
  text('TIME ' + fmtTime(S.time) + '   TIME BONUS +' + S.bonus, W / 2, 90, '#c8b8e8', 1, 'center');
  text('CANDY ' + S.candy + '/' + tokens.length + '   SOULS LOST ' + S.deaths, W / 2, 102, '#c8b8e8', 1, 'center');
  text('RANK: ' + S.rank, W / 2, 116, '#ffd23c', 1, 'center');
  ctx.fillStyle = '#3a1a4a'; ctx.fillRect(40, 132, W - 80, 1);
  drawPumpkin(70, 166, 2, S.t); drawPumpkin(W - 70, 166, 2, S.t + 1.7);
  text('HAPPY', W / 2, 142, '#b06cff', 2, 'center');
  text('HALLOWEEN', W / 2, 160, '#ff8a1c', 2, 'center');
  text('The stack is safe... for now.', W / 2, 186, '#c8b8e8', 1, 'center');
  text('Think you can do better? Prove it.', W / 2, 200, '#f0e8fc', 1, 'center');
  for (const k of ['again', 'share']) {
    const b = BTN[k];
    ctx.fillStyle = k === 'share' ? '#ff8a1c' : '#32194d'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(b.x, b.y, b.w, 1);
    text(b.label, b.x + b.w / 2, b.y + 8, k === 'share' ? '#2a1000' : '#ffffff', 1, 'center');
  }
  if (toast && toast.t > 0) text(toast.s, W / 2, 268, '#7dff5a', 1, 'center');
  ctx.globalAlpha = 1;
}
let popClock = 0;
function sfxPop() { if (!AC || muted) return; const t = AC.currentTime; if (t - popClock < 0.15) return; popClock = t; noise(t, 0.25, { vol: 0.07, hp: 1500 }); }

async function share() {
  const url = location.href.split('?')[0].split('#')[0];
  const msg = `I survived Gecko Quest: Halloween Edition in ${fmtTime(S.time)} with ${S.score} pts (rank: ${S.rank}, ${S.deaths} souls lost). Can you beat it? 🎃🦎`;
  try { await navigator.clipboard.writeText(msg + ' ' + url); toast = { s: 'SCORE COPIED - PASTE IT IN YOUR POST', t: 3 }; } catch (e) { toast = { s: 'OPENING LINKEDIN...', t: 3 }; }
  if (navigator.share && document.body.classList.contains('coarse')) { try { await navigator.share({ title: 'Gecko Quest: Halloween Edition', text: msg, url }); return; } catch (e) {} }
  try { window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url), '_blank', 'noopener'); } catch (e) {}
}

function debugWarp(z) {
  if (S.mode !== 'play') reset();
  const c = checkpoints.find(k => k.start && Math.floor(k.x / (ZW * TS)) === z);
  if (!c) return;
  for (const k of checkpoints) if (k.x <= c.x) k.on = true;
  pl.cpx = c.x; pl.cpy = c.y; S.zone = z - 1; respawn(true); S.cam = Math.max(0, pl.x - W * 0.4);
}

/* ====================================================================== main loop */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.t += dt;
  musicTick();
  if (toast) toast.t -= dt;
  if (S.mode === 'title') {
    drawTitle(S.t);
    if (anyPress || BOT) { anyPress = false; tap = null; audioInit(); reset(); musicStart(); }
  } else {
    if (S.mode === 'play') {
      acc += dt;
      while (acc >= STEP) { if (BOT) botThink(STEP); stepWorld(STEP); acc -= STEP; }
      const lf = S.t % 6.5;
      if (lf < lastFlash && Math.min(5, Math.floor((S.cam + W / 2) / (ZW * TS))) === 2) sfx('thunder');
      lastFlash = lf;
    } else { acc = 0; }
    stepParticles(dt);
    S.shake = Math.max(0, S.shake - dt);
    ctx.save();
    if (S.shake > 0) ctx.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 4));
    drawBackground(S.t);
    drawTiles(); drawDecos(S.t); drawMovers(); drawCheckpoints(); drawGate();
    for (const p of potions) if (!p.got) drawPotion(p);
    for (const k of tokens) if (!k.got) drawToken(k);
    for (const e of enemies) drawEnemy(e);
    drawPlayer(); drawParticles();
    drawFog(S.t);
    ctx.restore();
    drawHUD();
    if (S.mode === 'win') {
      drawWin(dt);
    }
  }
  tap = null; anyPress = false;
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); last = performance.now(); });
setMuted(muted);
SPR.onload = () => requestAnimationFrame(frame);
window.__G = { S, pl, get tokens() { return tokens; }, get enemies() { return enemies; }, get checkpoints() { return checkpoints; } };
</script>
